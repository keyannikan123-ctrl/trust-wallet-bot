name: BNB Network Connection Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  network-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile Bot.py

      - name: Test BNB connection
        run: python -c "import json,urllib.request; u='https://bsc-dataseed.bnbchain.org/'; d=json.dumps({'jsonrpc':'2.0','method':'eth_chainId','params':[],'id':1}).encode(); r=urllib.request.Request(u,data=d,headers={'Content-Type':'application/json'}); x=json.loads(urllib.request.urlopen(r,timeout=15).read()); print('Chain ID:',int(x['result'],16)); assert int(x['result'],16)==56,'Wrong network'; print('BNB connection successful')"
